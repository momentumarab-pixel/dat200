<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>DAT200 — Eksamenssimulator</title>

<!-- ============================================================
     DAT200 EKSAMENSSIMULATOR — Offline HTML-app
     Lag av: Haron
     
     SLIK LEGGER DU TIL FLERE SPØRSMÅL:
     Scroll down to the <script id="question-bank"> block and add
     new questions in the same format. Each question has:
       - id           (unique string)
       - chapter      (chapter name, used for grouping)
       - type         (see 15 types below)
       - question     (the question text)
       - ...type-specific fields (options, answer, etc)
       - explanation  (shown on wrong answer)

     SUPPORTED TYPES:
       1.  true_false        — True/False
       2.  single            — Multiple choice, one correct
       3.  multi             — Multiple choice, multiple correct
       4.  order             — Sort steps in correct order
       5.  match             — Match pairs (term ↔ definition)
       6.  formula_match     — Match formula to name
       7.  symbol            — Explain symbol in equation
       8.  fill_blank        — Fill in the blank
       9.  plot              — Interpret graph (with image URL or emoji)
       10. figure            — Interpret figure/matrix
       11. code              — Understand short code
       12. select_correct    — Select correct statement
       13. select_wrong      — Select incorrect statement
       14. scenario          — Scenario-based
       15. process           — Process from start to finish (same as order)
============================================================ -->

<style>
  /* ============ DESIGN TOKENS ============ */
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --surface-2: #f5f5f4;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --ink: #1c1917;
    --ink-2: #44403c;
    --ink-3: #78716c;
    --ink-4: #a8a29e;
    
    --accent: #1e3a5f;      /* navy — matcher Haron's tese */
    --accent-soft: #eef2f7;
    
    --correct: #15803d;
    --correct-bg: #f0fdf4;
    --correct-border: #bbf7d0;
    
    --wrong: #b91c1c;
    --wrong-bg: #fef2f2;
    --wrong-border: #fecaca;
    
    --warn: #b45309;
    --warn-bg: #fffbeb;
    
    --radius: 6px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow: 0 4px 12px rgba(0,0,0,.06);
    
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  
  /* Last fonter offline-vennlig: hvis font ikke finnes, faller den tilbake til system. 
     For HELT offline-funksjonalitet brukes systemfonter når Google Fonts ikke er tilgjengelig. */
  /* System fonts — fully offline, no external requests */
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* ============ TOPPLINJE ============ */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .logo {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .brand .sub {
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .score-pill {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }
  .timer {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    font-size: 14px;
  }
  
  /* ============ HOVED-LAYOUT ============ */
  main {
    flex: 1;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  
  /* ============ START-SKJERM ============ */
  .start-screen { animation: fadeIn .4s ease; }
  .start-screen h1 {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 42px;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .start-screen .lede {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 18px;
    color: var(--ink-3);
    margin-bottom: 36px;
    max-width: 580px;
  }
  
  .info-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    padding: 0;
    margin-bottom: 16px;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .info-toggle .chevron { transition: transform .2s ease; font-style: normal; }
  .info-toggle.open .chevron { transform: rotate(180deg); }

  .info-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    margin-bottom: 24px;
    display: none;
    gap: 20px;
    flex-direction: column;
  }
  .info-box.visible { display: flex; }
  .info-box h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .info-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .info-card .ic-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .info-card .ic-body {
    font-size: 13px;
    color: var(--ink-3);
    line-height: 1.6;
  }
  .qtypes-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .qtype-pill {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 99px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .info-tip {
    font-size: 13px;
    color: var(--ink-3);
    line-height: 1.7;
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }
  @media (max-width: 600px) {
    .info-grid { grid-template-columns: 1fr; }
  }

  .chapter-list {
    display: grid;
    gap: 10px;
    margin-bottom: 32px;
  }
  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all .15s ease;
    text-align: left;
    font-family: inherit;
    width: 100%;
    color: inherit;
  }
  .chapter-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .chapter-card .title {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .chapter-card .meta {
    font-size: 13px;
    color: var(--ink-3);
  }
  .chapter-card .arrow {
    color: var(--ink-4);
    font-size: 20px;
    transition: transform .15s ease;
  }
  .chapter-card:hover .arrow { transform: translateX(3px); color: var(--accent); }
  
  .chapter-card.master {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  .chapter-card.master .meta { color: rgba(255,255,255,.7); }
  .chapter-card.master .arrow { color: rgba(255,255,255,.7); }
  .chapter-card.master:hover { background: var(--accent); border-color: var(--accent); }

  /* ── Mode cards (clean professional style) ── */
  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all .15s ease;
    text-align: left;
    font-family: inherit;
    width: 100%;
    color: var(--ink);
    gap: 12px;
  }
  .mode-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .mode-card .mc-body { flex: 1; }
  .mode-card .mc-title { font-weight: 700; font-size: 16px; margin-bottom: 3px; }
  .mode-card .mc-desc { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
  .mode-card .mc-count {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-4); margin-bottom: 4px;
  }
  .mode-card .mc-arrow { color: var(--ink-4); font-size: 18px; flex-shrink: 0; transition: transform .15s; }
  .mode-card:hover .mc-arrow { transform: translateX(3px); }
  .mc-slate  { border-left-color: #475569; } .mc-slate:hover  { border-color: #475569; }
  .mc-teal   { border-left-color: #0d9488; } .mc-teal:hover   { border-color: #0d9488; }
  .mc-purple { border-left-color: #7c3aed; } .mc-purple:hover { border-color: #7c3aed; }
  .mc-orange { border-left-color: #ea580c; } .mc-orange:hover { border-color: #ea580c; }
  .mc-blue   { border-left-color: #2563eb; } .mc-blue:hover   { border-color: #2563eb; }
  .mc-red    { border-left-color: #dc2626; } .mc-red:hover    { border-color: #dc2626; }
  
  .stats-strip {
    display: flex;
    gap: 24px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 24px;
  }
  .stats-strip .stat {
    display: flex;
    flex-direction: column;
  }
  .stats-strip .stat-num {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stats-strip .stat-label {
    font-size: 12px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  
  .reset-btn {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--ink-3);
    padding: 8px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: all .15s;
  }
  .reset-btn:hover { color: var(--wrong); border-color: var(--wrong); }
  
  /* ============ EKSAMEN-SKJERM ============ */
  .exam-screen { animation: fadeIn .3s ease; }
  
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }
  
  .question-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-3);
  }
  .question-meta .qtype {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    font-size: 11px;
    color: var(--accent);
  }
  
  .question-stem {
    font-family: var(--font-serif);
    font-size: 22px;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 28px;
    font-weight: 400;
  }
  .question-stem .formula,
  .question-stem code {
    font-family: var(--font-mono);
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.9em;
    border: 1px solid var(--border);
  }
  .question-stem .formula-block {
    display: block;
    margin: 16px 0;
    padding: 16px 20px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 15px;
    line-height: 1.6;
  }
  .question-instruction {
    font-size: 14px;
    color: var(--ink-3);
    margin-bottom: 20px;
    font-style: italic;
  }
  
  /* ============ SVAR-ALTERNATIVER ============ */
  .options { display: grid; gap: 10px; margin-bottom: 28px; }
  
  .option {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    cursor: pointer;
    transition: all .12s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    width: 100%;
  }
  .option:hover:not(:disabled) {
    border-color: var(--ink-3);
    background: var(--surface-2);
  }
  .option .marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    font-size: 12px;
    color: var(--ink-3);
    flex-shrink: 0;
    margin-top: 1px;
    font-weight: 600;
  }
  .option.multi .marker { border-radius: 4px; }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.selected .marker { background: var(--accent); border-color: var(--accent); color: white; }
  
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--ink);
  }
  .option.correct .marker { background: var(--correct); border-color: var(--correct); color: white; }
  
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--ink);
  }
  .option.wrong .marker { background: var(--wrong); border-color: var(--wrong); color: white; }
  
  .option.missed {
    border-color: var(--correct);
    background: var(--correct-bg);
    border-style: dashed;
  }
  .option.missed .marker { background: var(--correct); border-color: var(--correct); color: white; }
  
  .option:disabled { cursor: default; }
  .kbd-hint {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 4px;
    width: 18px; height: 18px; font-size: 10px; font-weight: 700;
    color: var(--ink-3); margin-right: 6px; flex-shrink: 0;
    font-family: var(--font-mono);
  }
  .option:hover .kbd-hint, .option.selected .kbd-hint { background: rgba(255,255,255,.25); color: inherit; }
  .kb-bar {
    text-align: center; font-size: 11px; color: var(--ink-4);
    margin-top: 12px; letter-spacing: .02em;
  }
  .kb-bar kbd {
    display: inline-block; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: var(--font-mono);
    color: var(--ink-3);
  }
  .wiseflow-badge {
    font-size: 72px; font-weight: 800; text-align: center;
    font-family: var(--font-serif); line-height: 1; margin-bottom: 8px;
  }
  .wiseflow-info {
    background: #fff8e1; border: 1px solid #fde68a; border-radius: var(--radius-lg);
    padding: 14px 18px; font-size: 13px; color: #92400e; line-height: 1.6;
    margin-bottom: 20px;
  }
  .option-explain {
    display: block;
    font-size: 0.72rem;
    font-style: italic;
    opacity: 0.75;
    margin-top: 5px;
    padding-left: 30px;
    text-align: left;
    line-height: 1.4;
  }
  
  /* ============ ORDER (drag/click) ============ */
  .order-list { display: grid; gap: 8px; margin-bottom: 28px; }
  .order-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
  }
  .order-item .num {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .order-item .text { flex: 1; font-size: 15px; }
  .order-controls { display: flex; gap: 4px; }
  .order-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    width: 32px;
    height: 32px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .order-btn:hover:not(:disabled) { background: var(--border); }
  .order-btn:disabled { opacity: 0.3; cursor: default; }
  .order-item.correct { border-color: var(--correct); background: var(--correct-bg); }
  .order-item.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  
  /* ============ MATCH ============ */
  .match-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .match-col h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .match-list { display: grid; gap: 8px; }
  .match-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all .12s;
  }
  .match-item:hover:not(.locked) { border-color: var(--ink-3); }
  .match-item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .match-item.matched {
    background: var(--surface-2);
    border-style: dashed;
    cursor: default;
  }
  .match-item.matched .pair-num {
    display: inline-block;
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--accent);
    margin-right: 8px;
  }
  .match-item.correct { border-color: var(--correct); background: var(--correct-bg); }
  .match-item.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  
  /* ============ FILL BLANK ============ */
  .fill-blank-input {
    font-family: var(--font-mono);
    font-size: 16px;
    padding: 10px 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    width: 100%;
    max-width: 400px;
    margin-bottom: 28px;
    color: var(--ink);
  }
  .fill-blank-input:focus { outline: none; border-color: var(--accent); }
  .fill-blank-input.correct { border-color: var(--correct); background: var(--correct-bg); }
  .fill-blank-input.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  
  /* ============ FIGURE / PLOT / CODE BLOCK ============ */
  .figure-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    text-align: center;
  }
  .figure-box .ascii {
    font-family: var(--font-mono);
    white-space: pre;
    line-height: 1.4;
    font-size: 13px;
    color: var(--ink-2);
    text-align: left;
    display: inline-block;
  }
  .figure-box img {
    max-width: 100%;
    border-radius: 4px;
  }
  .code-block {
    background: #1c1917;
    color: #fafaf9;
    padding: 16px 18px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
    overflow-x: auto;
    white-space: pre;
  }
  
  /* ============ FEEDBACK BOX ============ */
  .feedback {
    margin-top: 8px;
    margin-bottom: 24px;
    padding: 18px 20px;
    border-radius: var(--radius);
    border-left: 3px solid;
    animation: slideIn .25s ease;
  }
  .feedback.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .feedback.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .feedback .verdict {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .feedback.correct .verdict { color: var(--correct); }
  .feedback.wrong .verdict { color: var(--wrong); }
  .feedback .explanation {
    font-family: var(--font-serif);
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
  }
  .feedback .correct-answer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--wrong-border);
    font-size: 14px;
    color: var(--ink-2);
  }
  .feedback .correct-answer strong { color: var(--ink); }

const FORMULA_QUIZ_QUESTIONS = [
  {id:'fq_001',chapter:'Formula Quiz',type:'single',question:'In the SVM margin formula "Margin = 2 / ‖w‖", what does ‖w‖ represent?',options:['The learning rate','The Euclidean norm (length) of the weight vector','The number of support vectors','The bias term b'],answer:1,explanation:'‖w‖ is the Euclidean norm of the weight vector. Maximizing the margin is equivalent to minimizing ‖w‖.'},
  {id:'fq_002',chapter:'Formula Quiz',type:'single',question:'In soft-margin SVM: min ½‖w‖² + C·Σξᵢ — what does C control?',options:['The number of support vectors','The kernel bandwidth','The trade-off between margin width and misclassification tolerance','The learning rate'],answer:2,explanation:'C is the regularization parameter. Large C = narrow margin, fewer training errors. Small C = wide margin, more tolerant of misclassification.'},
  {id:'fq_003',chapter:'Formula Quiz',type:'single',question:'What is ξᵢ (xi) in the soft-margin SVM objective?',options:['The feature value of sample i','The label of sample i','The slack variable measuring how far sample i violates the margin','The distance from sample i to the hyperplane'],answer:2,explanation:'ξᵢ is the slack variable. It measures by how much sample i violates the margin. ξᵢ = 0 means correctly classified outside the margin.'},
  {id:'fq_004',chapter:'Formula Quiz',type:'single',question:'In the sigmoid σ(z) = 1/(1+e⁻ᶻ), what is z?',options:['The output probability','The class label (0 or 1)','The linear combination wᵀx + b (net input)','The learning rate'],answer:2,explanation:'z is the net input wᵀx + b. The sigmoid squashes this real number into a probability in (0, 1).'},
  {id:'fq_005',chapter:'Formula Quiz',type:'single',question:'In the cross-entropy cost J(w) = −(1/n)·Σ[yᵢ·log(ŷᵢ) + (1−yᵢ)·log(1−ŷᵢ)], what is ŷᵢ?',options:['The true label (0 or 1)','The hard predicted class','The predicted probability σ(wᵀxᵢ + b)','The sample weight'],answer:2,explanation:'ŷᵢ is the predicted probability from the sigmoid — a continuous value in (0,1), not the hard 0/1 label.'},
  {id:'fq_006',chapter:'Formula Quiz',type:'single',question:'In Adaline weight update wⱼ := wⱼ + η·Σ(yᵢ − ŷᵢ)·xᵢⱼ, what does η represent?',options:['The number of training epochs','The learning rate — step size for each update','The prediction error','The feature value xᵢⱼ'],answer:1,explanation:'η (eta) is the learning rate. It controls the step size of weight updates. Too large → overshooting; too small → slow convergence.'},
  {id:'fq_007',chapter:'Formula Quiz',type:'single',question:'In gradient descent w := w − η·∇J(w), what is ∇J(w)?',options:['The next weight vector','The learning rate × weights','The gradient — vector of partial derivatives of the cost function','The Hessian matrix'],answer:2,explanation:'∇J(w) is the gradient — a vector of partial derivatives ∂J/∂wⱼ. It points toward steepest ascent; subtracting it moves toward the minimum.'},
  {id:'fq_008',chapter:'Formula Quiz',type:'single',question:'In PCA, what does the eigenvalue λ measure?',options:['Class separability in that direction','Number of samples on that component','Variance explained along the corresponding principal component','Correlation between features'],answer:2,explanation:'Each eigenvalue λ measures how much variance is captured along its eigenvector (principal component). Larger λ = more important component.'},
  {id:'fq_009',chapter:'Formula Quiz',type:'single',question:'What does EVRₖ = λₖ / Σᵢλᵢ calculate in PCA?',options:['The k-th eigenvalue in absolute terms','The fraction of total variance captured by the k-th principal component','Cumulative variance up to component k','The ratio of between-class to within-class variance'],answer:1,explanation:'EVRₖ is the Explained Variance Ratio — the fraction of total data variance that component k captures.'},
  {id:'fq_010',chapter:'Formula Quiz',type:'single',question:'In LDA, what does S_B measure?',options:['Within-class scatter around each class mean','Between-class scatter — how far class means are from the global mean','Total scatter of the dataset','Covariance of the feature matrix'],answer:1,explanation:'S_B = Σᵢ nᵢ·(μᵢ − μ)(μᵢ − μ)ᵀ measures how separated the class centroids are from the overall mean.'},
  {id:'fq_011',chapter:'Formula Quiz',type:'single',question:'What does LDA maximize?',options:['wᵀS_W w','wᵀS_B w','wᵀS_B w / wᵀS_W w — ratio of between to within scatter','Total variance of projected data'],answer:2,explanation:'LDA finds the projection w that maximizes between-class spread relative to within-class spread: J(w) = wᵀS_Bw / wᵀS_Ww.'},
  {id:'fq_012',chapter:'Formula Quiz',type:'single',question:'Why does L1 (Lasso) enable feature selection?',options:['It adds a large constant to all weights','It can drive individual weights to exactly zero','It increases the learning rate for important features','It creates a quadratic penalty'],answer:1,explanation:'The L1 penalty creates diamond-shaped constraint regions with corners on the axes. The optimum often lands at a corner, setting some wⱼ = 0 exactly.'},
  {id:'fq_013',chapter:'Formula Quiz',type:'single',question:'Key difference between L1 and L2 regularization?',options:['L1 uses squared weights; L2 uses absolute values','L1 uses |wⱼ| (sparsity); L2 uses wⱼ² (shrinkage)','L1 adds a constant; L2 multiplies','L1 is for regression; L2 for classification only'],answer:1,explanation:'L1: λ·Σ|wⱼ| — can zero out weights (sparsity/feature selection). L2: λ·Σwⱼ² — shrinks all weights toward zero but rarely reaches exactly zero.'},
  {id:'fq_014',chapter:'Formula Quiz',type:'single',question:'In Gini(t) = 1 − Σₖ p(k|t)², what does p(k|t) represent?',options:['Number of class-k samples at node t','Proportion of class-k samples at node t','Weight assigned to class k','Fraction of nodes at depth t that are pure'],answer:1,explanation:'p(k|t) is the proportion of class k at node t. Gini = 0 means pure node; Gini ≈ 0.5 means maximally mixed (binary case).'},
  {id:'fq_015',chapter:'Formula Quiz',type:'single',question:'What does Information Gain measure in decision trees?',options:['Increase in Gini after a split','Number of samples changing class after split','Reduction in entropy achieved by the split','Maximum depth after the split'],answer:2,explanation:'IG = H(parent) − Σⱼ(nⱼ/n)·H(childⱼ). Splits that create purer children have higher IG.'},
  {id:'fq_016',chapter:'Formula Quiz',type:'single',question:'In AdaBoost, what is εⱼ?',options:['Learning rate for classifier j','Weighted misclassification rate of weak learner j','Number of misclassified samples in round j','Classifier weight in final vote'],answer:1,explanation:'εⱼ = Σᵢwᵢ·𝟙[ŷᵢ≠yᵢ]/Σᵢwᵢ — the weighted error rate. Classifiers with εⱼ < 0.5 are better than random.'},
  {id:'fq_017',chapter:'Formula Quiz',type:'single',question:'In AdaBoost, αⱼ = ½·ln((1−εⱼ)/εⱼ). What is αⱼ when εⱼ = 0.5?',options:['Infinity — very strong classifier','Zero — classifier contributes nothing','Negative — predictions are inverted','Equal to the learning rate'],answer:1,explanation:'ln(0.5/0.5) = ln(1) = 0, so αⱼ = 0. A classifier that is no better than random gets zero voting weight.'},
  {id:'fq_018',chapter:'Formula Quiz',type:'single',question:'In gradient boosting Fₘ(x) = Fₘ₋₁(x) + η·hₘ(x), what are pseudo-residuals rᵢₘ = yᵢ − Fₘ₋₁(xᵢ)?',options:['The predictions of the previous ensemble','The errors the current ensemble makes — what hₘ is trained to predict','The learning rate × tree prediction','The gradient of L2 loss w.r.t. model parameters'],answer:1,explanation:'rᵢₘ is the residual — what the ensemble got wrong. Each new tree hₘ is trained to predict these errors, equivalent to gradient descent on MSE.'},
  {id:'fq_019',chapter:'Formula Quiz',type:'single',question:'In K-means J = Σₖ Σₓ∈Cₖ ‖x − μₖ‖², what is μₖ?',options:['The learning rate at iteration k','The k-th training sample','The centroid (mean vector) of cluster k','The number of samples in cluster k'],answer:2,explanation:'μₖ is the centroid of cluster k — the mean position of all samples assigned to cluster k. K-means recomputes μₖ after each assignment step.'},
  {id:'fq_020',chapter:'Formula Quiz',type:'single',question:'What does the K-means objective J minimize?',options:['Number of clusters K','Between-cluster distance','Total within-cluster sum of squared distances to centroids','Variance of cluster sizes'],answer:2,explanation:'J is the inertia (within-cluster SSE). K-means assigns samples to the nearest centroid and recomputes centroids to minimize J.'},
  {id:'fq_021',chapter:'Formula Quiz',type:'single',question:'What is a false negative (FN)?',options:['Predicted positive, actually negative (Type I)','Predicted negative, actually negative','Predicted negative, actually positive (Type II)','Predicted positive, actually positive'],answer:2,explanation:'FN: the model predicted negative but the true class is positive — a missed detection (Type II error). In medicine: missing a disease that is present.'},
  {id:'fq_022',chapter:'Formula Quiz',type:'single',question:'What does Recall = TP/(TP+FN) measure?',options:['Of predicted positives, how many are truly positive','Of actual positives, how many the model found','Overall fraction of correct classifications','Harmonic mean of precision and recall'],answer:1,explanation:'Recall (Sensitivity) = fraction of actual positives correctly identified. High recall → few false negatives. Critical when missing positives is costly.'},
  {id:'fq_023',chapter:'Formula Quiz',type:'single',question:'What does Precision = TP/(TP+FP) measure?',options:['Of actual positives, what fraction the model found','Harmonic mean of sensitivity and specificity','Of predicted positives, what fraction are truly positive','Overall accuracy'],answer:2,explanation:'Precision = of all predicted positives, how many actually are positive. High precision → few false alarms. Useful when false positives are costly.'},
  {id:'fq_024',chapter:'Formula Quiz',type:'single',question:'In RBF kernel κ(x,z) = exp(−γ·‖x−z‖²), what does increasing γ do?',options:['Wider kernel — smoother boundary — underfitting risk','Narrower kernel — complex boundary — overfitting risk','Creates a linear boundary','Reduces support vectors needed'],answer:1,explanation:'Large γ = narrow Gaussian. Only very close points influence each other, creating a wiggly boundary that can overfit. Small γ = wide, smoother boundary.'},
  {id:'fq_025',chapter:'Formula Quiz',type:'single',question:'When is κ(x,z) = 1 in the RBF kernel?',options:['When x and z are identical (distance = 0)','When they are maximally far apart','When γ = 1','When the kernel is undefined'],answer:0,explanation:'exp(−γ·0) = exp(0) = 1. The RBF kernel reaches its maximum of 1 only when x = z exactly.'},
  {id:'fq_026',chapter:'Formula Quiz',type:'single',question:'In E[MSE] = Bias²(ŷ) + Var(ŷ) + σ², what is σ²?',options:['Variance of predictions across training sets','Squared error from wrong model assumptions','Irreducible noise inherent in the data — no model can remove it','The regularization strength'],answer:2,explanation:'σ² is the irreducible error — noise in the data itself (measurement noise, hidden variables). It cannot be reduced by any model no matter how complex.'},
  {id:'fq_027',chapter:'Formula Quiz',type:'single',question:'What does the Variance component in Bias²+Var+σ² represent?',options:['Error from wrong model assumptions (underfitting)','Error from sensitivity to training data fluctuations (overfitting)','Irreducible noise','Gap between training and test accuracy'],answer:1,explanation:'Variance = how much predictions change when trained on different data subsets. High variance = memorizing training data = overfitting.'},
  {id:'fq_028',chapter:'Formula Quiz',type:'single',question:'What does R² = 0 mean for a regression model?',options:['Perfect fit','The model performs the same as just predicting the mean ȳ','Model predicts zero for all inputs','50% error rate'],answer:1,explanation:'R² = 1 − SS_res/SS_tot. R² = 0 means SS_res = SS_tot — model errors are as large as using the mean ȳ as prediction. Zero variance explained.'},
  {id:'fq_029',chapter:'Formula Quiz',type:'single',question:'In OLS w = (XᵀX)⁻¹·Xᵀy, why must XᵀX be invertible?',options:['To prevent overfitting','Because singular matrices have infinite eigenvalues','Perfectly correlated features make the system underdetermined — no unique solution','To guarantee a positive learning rate'],answer:2,explanation:'Multicollinearity (perfectly correlated features) makes XᵀX singular. Ridge regression fixes this by adding λI: (XᵀX + λI)⁻¹.'},
  {id:'fq_030',chapter:'Formula Quiz',type:'single',question:'What is the purpose of RANSAC in regression?',options:['Speed up gradient descent with mini-batches','Fit a robust model by iteratively ignoring outliers','Perform cross-validation on coefficients','Apply L1 regularization automatically'],answer:1,explanation:'RANSAC randomly samples a minimal subset, fits a model, counts inliers (within a threshold), and repeats. The model with the most inliers wins — robust to outliers.'},
  {id:'fq_031',chapter:'Formula Quiz',type:'single',question:'What does the covariance matrix Σ = (1/(n−1))·XᵀX capture (mean-centered X)?',options:['Correlation between labels and features','How each feature varies and co-varies with every other feature','The L2 norm of each feature column','Entropy of the feature distribution'],answer:1,explanation:'Σ is d×d. Diagonal = variances; off-diagonal = covariances between feature pairs. PCA finds the directions of maximum variance in this space.'},
  {id:'fq_032',chapter:'Formula Quiz',type:'single',question:'When is entropy H(t) = −Σₖ p(k|t)·log₂ p(k|t) equal to 0?',options:['All classes equally represented','Exactly 2 classes present','All samples at node t belong to the same class','Node has exactly one sample'],answer:2,explanation:'H = 0 when one class has p = 1 and all others p = 0. 1·log₂(1) = 0 and 0·log₂(0) = 0 by convention. A pure node has zero entropy.'},
  {id:'fq_033',chapter:'Formula Quiz',type:'single',question:'In gradient boosting, what does the learning rate η control in Fₘ = Fₘ₋₁ + η·hₘ?',options:['Depth of each tree','Number of boosting rounds','How much each new tree contributes — small η with more trees improves generalization','Fraction of samples used to train hₘ'],answer:2,explanation:'η shrinks each tree\'s contribution. Small η requires more trees for the same accuracy but generally leads to better generalization — classic regularization via shrinkage.'},
  {id:'fq_034',chapter:'Formula Quiz',type:'single',question:'What does log(p/(1−p)) = wᵀx + b express in logistic regression?',options:['The sigmoid output probability','The predicted hard class label','The linear relationship between features and log-odds of the positive class','The cross-entropy loss for a sample'],answer:2,explanation:'The logit (log-odds) is the inverse of sigmoid. Logistic regression models log-odds as linear in features. Applying sigmoid converts this back to a probability.'},
  {id:'fq_035',chapter:'Formula Quiz',type:'single',question:'In AdaBoost weight update wᵢ := wᵢ · exp(−αⱼ·yᵢ·ŷᵢ), what happens to a misclassified sample\'s weight?',options:['Decreases — sample becomes less important','Stays the same','Increases — misclassified samples get more focus next round','Set to zero — removed'],answer:2,explanation:'When yᵢ ≠ ŷᵢ, yᵢ·ŷᵢ < 0, so exp(−αⱼ·yᵢ·ŷᵢ) > 1 — weight increases. The next classifier focuses harder on hard examples.'},
  {id:'fq_036',chapter:'Formula Quiz',type:'single',question:'What does S_W measure in LDA: S_W = Σᵢ Σₓ∈Cᵢ (x − μᵢ)(x − μᵢ)ᵀ?',options:['How spread class means are from the global mean','Total variance of the dataset','Spread of samples within each class around their class mean','Correlation between features within classes'],answer:2,explanation:'S_W is the within-class scatter. Small S_W means samples cluster tightly around their class centroid. LDA minimizes S_W while maximizing S_B.'},
  {id:'fq_037',chapter:'Formula Quiz',type:'single',question:'In the perceptron update wⱼ := wⱼ + η·(yᵢ − ŷᵢ)·xᵢⱼ, when does the update fire?',options:['Every training sample','Only correctly classified samples','Only when prediction ŷᵢ differs from true label yᵢ','Only when wⱼ is below a threshold'],answer:2,explanation:'When ŷᵢ = yᵢ, (yᵢ − ŷᵢ) = 0, no update. The perceptron only updates on errors. Adaline differs — it always updates using continuous output.'},
  {id:'fq_038',chapter:'Formula Quiz',type:'single',question:'Why does the F1 score use harmonic mean instead of arithmetic mean?',options:['Harmonic mean is always larger','Harmonic mean penalizes imbalance — a low value in either metric strongly pulls F1 down','Arithmetic mean is undefined when P+R=1','Harmonic mean is faster to compute'],answer:1,explanation:'The harmonic mean is especially sensitive to small values. If Precision = 0 or Recall = 0, F1 = 0. This penalizes models that excel on one metric while failing the other.'}
];

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const h = raw ? JSON.parse(raw) : { chapters: {}, total: { taken: 0, correct: 0 } };
    if (!h.wrongIds) h.wrongIds = [];
    if (!h.bookmarks) h.bookmarks = [];
    if (h.dark === undefined) h.dark = false;
    return h;
  } catch (e) {
    return { chapters: {}, total: { taken: 0, correct: 0 } };
  }
}
function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
  } catch (e) { /* offline-safe */ }
}

// ===== UTILS =====
const $ = (sel) => document.querySelector(sel);
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'disabled' && v) e.setAttribute('disabled', '');
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function chaptersOf() {
  const map = new Map();
  for (const q of QUESTIONS) {
    if (!map.has(q.chapter)) map.set(q.chapter, 0);
    map.set(q.chapter, map.get(q.chapter) + 1);
  }
  return [...map.entries()];
}
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function renderTopbar() {
  const right = $('#topbar-right');
  right.innerHTML = '';
  right.appendChild(el('button', {

    onclick: () => toggleLang()
  }, state.lang === 'en' ? 'NO' : 'EN'));

function startExam(pool) {
  state.currentPool = pool;
  state.wiseflowMode = false;
  state.questions = shuffle(pool);
  state.currentChapter = null;
  state.index = 0;
  state.answers = [];
  state.optionOrders = {};
  state.view = 'exam';
  state.startTime = Date.now();
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    const t = $('#timer');
    if (t) t.textContent = formatTime(Math.floor((Date.now() - state.startTime) / 1000));
  }, 1000);
  render();
}

function startWiseflow() {
  const pool = shuffle(TOP100_QUESTIONS).slice(0, 15);
  state.currentPool = pool;
  state.wiseflowMode = true;
  state.questions = pool;
  state.currentChapter = null;
  state.index = 0;
  state.answers = [];
  state.optionOrders = {};
  state.view = 'exam';
  const WISEFLOW_SECS = 45 * 60;
  state.startTime = Date.now();
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    const t = $('#timer');
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const left = Math.max(0, WISEFLOW_SECS - elapsed);
    if (t) {
      t.textContent = formatTime(left);
      t.style.color = left < 300 ? '#ef4444' : '';
    }
    if (left === 0) finishExam();
  }, 1000);
  render();
}

function goHome() {
  if (state.timerId) clearInterval(state.timerId);
  state.view = 'home';
  render();
}

// ===== EXAM SCREEN =====
function renderExam() {
  if (state.index >= state.questions.length) { finishExam(); return el('div', {}); }
  const q = state.questions[state.index];
  const wrap = el('div', { class: 'exam-screen' });

  // back / forward nav
  const nav = el('div', { class: 'back-nav', style: 'justify-content:space-between;' });
  nav.appendChild(el('button', { class: 'back-btn', disabled: state.index === 0, onclick: () => { state.index--; render(); } }, t('prev')));
  const canGoNext = state.index < state.questions.length - 1 && state.answers[state.index] !== undefined;
  nav.appendChild(el('button', { class: 'back-btn', disabled: !canGoNext, onclick: () => { if (canGoNext) { state.index++; render(); } } }, t('next')));
  wrap.appendChild(nav);

  // progress
  const progress = el('div', { class: 'progress-bar' });
  const fillPct = ((state.index) / state.questions.length) * 100;
  progress.appendChild(el('div', { class: 'progress-fill', style: `width: ${fillPct}%` }));
  wrap.appendChild(progress);

  // meta
  const meta = el('div', { class: 'question-meta' });
  meta.appendChild(el('span', { class: 'qtype' }, prettyType(q.type)));
  meta.appendChild(el('span', {}, t('q_of', state.index + 1, state.questions.length)));
  const metaRight = el('div', { class: 'question-meta-right', style: 'margin-left:auto;' });
  metaRight.appendChild(el('button', {
    class: 'back-btn', style: 'font-size:11px;padding:3px 8px;',
    onclick: () => toggleLang()
  }, state.lang === 'en' ? 'NO' : 'EN'));
  const isBookmarked = (state.history.bookmarks || []).includes(q.id);
  metaRight.appendChild(el('button', {
    class: 'bookmark-btn' + (isBookmarked ? ' bookmarked' : ''),
    title: isBookmarked ? 'Remove bookmark' : 'Bookmark',
    onclick: () => toggleBookmark(q.id)
  }, '★'));
  meta.appendChild(metaRight);
  wrap.appendChild(meta);

  // stem
  const stem = el('div', { class: 'question-stem', html: q.question.replace(/\n/g, '<br>') });
  wrap.appendChild(stem);

  // type-specific instruction
  const instr = typeInstruction(q.type);
  if (instr) wrap.appendChild(el('p', { class: 'question-instruction' }, instr));

  // type-specific UI
  const answered = state.answers[state.index] !== undefined;
  const answerUi = renderQuestionBody(q, answered ? state.answers[state.index] : null);
  wrap.appendChild(answerUi.node);

  // feedback (only after submit, never during WiseFLOW)
  if (answered && !state.wiseflowMode) {
    wrap.appendChild(renderFeedback(q, state.answers[state.index]));
  }

  // store reference so keyboard handler can submit
  state._currentQ = q;
  state._currentAnswerUi = answerUi;

  // actions
  if (!answered) {
    const submitSec = el('div', { class: 'submit-section' });
    submitSec.appendChild(el('div', { class: 'submit-section-title' }, state.lang === 'no' ? 'Lever svar' : 'Submit answer'));
    submitSec.appendChild(el('div', { class: 'submit-section-hint' }, state.lang === 'no' ? 'Velg eit svar ovenfor, deretter trykk kor sikker du er' : 'Select an answer above, then tap your confidence level'));
    const confDefs = [
      { key: 'guess',   label: t('conf_guess'),   cls: 'conf-guess'   },
      { key: 'unsure',  label: t('conf_unsure'),  cls: 'conf-unsure'  },
      { key: 'sure',    label: t('conf_sure'),    cls: 'conf-sure'    },
      { key: 'certain', label: t('conf_certain'), cls: 'conf-certain' },
    ];
    const confRow = el('div', { class: 'confidence-row' });
    confDefs.forEach(({ key, label, cls }) => {
      const btn = el('button', { class: `conf-btn ${cls}`, onclick: () => submitAnswer(q, answerUi.getValue, answerUi.canSubmit, key) });
      btn.appendChild(el('span', { class: 'conf-num' }, key === 'guess' ? '1' : key === 'unsure' ? '2' : key === 'sure' ? '3' : '4'));
      btn.appendChild(el('span', {}, label));
      confRow.appendChild(btn);
    });
    submitSec.appendChild(confRow);
    wrap.appendChild(submitSec);
    wrap.appendChild(el('div', { class: 'kb-bar', style: 'margin-top:10px;' }, el('kbd', {}, '1'), '–', el('kbd', {}, '4'), ' ', t('kb_select')));

    const mobileNav = el('div', { class: 'mobile-bottom-nav' });
    mobileNav.appendChild(el('button', { disabled: state.index === 0, onclick: () => { state.index--; render(); } }, t('prev')));
    mobileNav.appendChild(el('button', { onclick: () => goHome() }, t('cancel')));
    wrap.appendChild(mobileNav);

  } else if (state.wiseflowMode) {
    const wfActions = el('div', { class: 'actions' });
    wfActions.appendChild(el('button', {
      class: 'btn btn-primary', style: 'min-height:52px;font-size:16px;',
      onclick: () => { state.index++; if (state.index >= state.questions.length) finishExam(); else render(); }
    }, state.index + 1 < state.questions.length ? t('wf_next') : t('wf_finish')));
    wrap.appendChild(wfActions);
    const mobileNavWf = el('div', { class: 'mobile-bottom-nav' });
    mobileNavWf.appendChild(el('button', { disabled: state.index === 0, onclick: () => { state.index--; render(); } }, t('prev')));
    mobileNavWf.appendChild(el('button', { class: 'primary', onclick: () => { state.index++; if (state.index >= state.questions.length) finishExam(); else render(); } }, state.index + 1 < state.questions.length ? t('wf_next') : t('wf_finish')));
    wrap.appendChild(mobileNavWf);

  } else {
    // Anki rating — 0 / 5 / 10 / 15 spørsmål til neste gjentagelse
    const ratingSec = el('div', { class: 'rating-section' });
    ratingSec.appendChild(el('div', { class: 'rating-section-title' }, state.lang === 'no' ? 'Kom tilbake om … spørsmål' : 'Repeat in … questions'));
    const ratings = [
      { key: 'skip',  num: '0',  label: state.lang === 'no' ? 'Aldri' : 'Never',  cls: 'rating-skip'  },
      { key: 'again', num: '5',  label: state.lang === 'no' ? 'Vanskelig' : 'Hard', cls: 'rating-again' },
      { key: 'good',  num: '10', label: state.lang === 'no' ? 'OK' : 'OK',          cls: 'rating-good'  },
      { key: 'easy',  num: '15', label: state.lang === 'no' ? 'Lett' : 'Easy',      cls: 'rating-easy'  },
    ];
    const ratingRow = el('div', { class: 'rating-row' });
    ratings.forEach(({ key, num, label, cls }) => {
      const btn = el('button', { class: `rating-btn ${cls}`, onclick: () => rateAndNext(key) });
      btn.appendChild(el('span', { class: 'rating-num' }, num));
      btn.appendChild(el('span', { class: 'rating-label' }, label));
      ratingRow.appendChild(btn);
    });
    ratingSec.appendChild(ratingRow);
    wrap.appendChild(ratingSec);
    wrap.appendChild(el('div', { class: 'kb-bar', style: 'margin-top:8px;' }, el('kbd', {}, '1'), '–', el('kbd', {}, '4'), ' ', t('kb_rate')));

    const finDiv = el('div', { class: 'finish-link' });
    finDiv.appendChild(el('button', { class: 'btn btn-ghost', onclick: () => finishExam() }, t('finish_session', state.answers.filter(Boolean).length)));
    wrap.appendChild(finDiv);

    const mobileNavAfter = el('div', { class: 'mobile-bottom-nav' });
    mobileNavAfter.appendChild(el('button', { disabled: state.index === 0, onclick: () => { state.index--; render(); } }, t('prev')));
    const canNext = state.index < state.questions.length - 1;
    mobileNavAfter.appendChild(el('button', { class: canNext ? 'primary' : '', disabled: !canNext, onclick: () => { if (canNext) { state.index++; render(); } } }, canNext ? t('next') : (state.lang === 'no' ? 'Fullfør' : 'Finish')));
    wrap.appendChild(mobileNavAfter);
  }

  return wrap;
}

function prettyType(t) {
  const map = {
    true_false: 'True / False',
    single: 'One correct answer',
    multi: 'Multiple correct answers',
    order: 'Sort in order',
    match: 'Match pairs',
    formula_match: 'Identify formula',
    symbol: 'Symbol in equation',
    fill_blank: 'Fill in the blank',
    plot: 'Interpret graph',
    figure: 'Interpret figure',
    code: 'Interpret code',
    select_correct: 'Select correct statement',
    select_wrong: 'Select incorrect statement',
    scenario: 'Scenario',
    process: 'Process in order'
  };
  return map[t] || t;
}
function typeInstruction(tp) {
  if (tp === 'multi') return t('instr_multi');
  if (tp === 'order' || tp === 'process') return t('instr_order');
  if (tp === 'match') return t('instr_match');
  if (tp === 'fill_blank') return t('instr_fill');
  return null;
}

// ============ QUESTION BODIES ============
function renderQuestionBody(q, answered) {
  switch (q.type) {
    case 'true_false':       return bodyTrueFalse(q, answered);
    case 'single':
    case 'symbol':
    case 'plot':
    case 'figure':
    case 'code':
    case 'select_correct':
    case 'select_wrong':
    case 'scenario':         return bodySingleChoice(q, answered);
    case 'formula_match':    return bodyMatch(q, answered);
    case 'multi':            return bodyMultiChoice(q, answered);
    case 'order':
    case 'process':          return bodyOrder(q, answered);
    case 'match':            return bodyMatch(q, answered);
    case 'fill_blank':       return bodyFillBlank(q, answered);
    default:                 return bodySingleChoice(q, answered);
  }
}

// --- SINGLE CHOICE ---
function bodySingleChoice(q, answered) {
  let selected = answered ? answered.given : null;
  const wrap = el('div', {});
  if (q.code) wrap.appendChild(el('div', { class: 'code-block' }, q.code));
  if (q.figure) {
    const f = el('div', { class: 'figure-box' });
    f.appendChild(el('div', { class: 'ascii' }, q.figure));
    wrap.appendChild(f);
  }
  // get or create a stable shuffled order for this question slot
  if (!state.optionOrders) state.optionOrders = {};
  if (!state.optionOrders[state.index]) {
    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    state.optionOrders[state.index] = order;
  }
  const order = state.optionOrders[state.index];
  const list = el('div', { class: 'options' });
  order.forEach((origIdx, displayPos) => {
    const opt = q.options[origIdx];
    const isSelected = selected === origIdx;
    const btn = el('button', {
      class: 'option' + (isSelected ? ' selected' : ''),
      disabled: answered ? true : false,
      onclick: () => {
        if (answered) return;
        selected = origIdx;
        [...list.children].forEach((c, j) => c.classList.toggle('selected', order[j] === origIdx));
        document.querySelector('.submit-section')?.classList.add('ready');
      }
    });
    btn.appendChild(el('span', { class: 'marker' }, String.fromCharCode(65 + displayPos)));
    if (!answered) btn.appendChild(el('span', { class: 'kbd-hint' }, String(displayPos + 1)));
    btn.appendChild(el('span', {}, opt));
    if (answered) {
      if (origIdx === q.answer) btn.classList.add('correct');
      else if (answered.given === origIdx) btn.classList.add('wrong');
      if (q.optionExplanations && q.optionExplanations[origIdx]) {
        btn.appendChild(el('span', { class: 'option-explain' }, q.optionExplanations[origIdx]));
      }
    }
    list.appendChild(btn);
  });
  wrap.appendChild(list);
  return {
    node: wrap,
    getValue: () => selected,
    canSubmit: () => selected !== null
  };
}

// --- TRUE / FALSE ---
function bodyTrueFalse(q, answered) {
  let selected = answered ? answered.given : null;
  const list = el('div', { class: 'options' });
  const opts = [{ v: true, label: 'True' }, { v: false, label: 'False' }];
  opts.forEach(({ v, label }, i) => {
    const btn = el('button', {
      class: 'option' + (selected === v ? ' selected' : ''),
      disabled: answered ? true : false,
      onclick: () => {
        if (answered) return;
        selected = v;
        [...list.children].forEach((c, j) => c.classList.toggle('selected', opts[j].v === v));
        document.querySelector('.submit-section')?.classList.add('ready');
      }
    });
    btn.appendChild(el('span', { class: 'marker' }, v ? '✓' : '✗'));
    btn.appendChild(el('span', {}, label));
    if (answered) {
      if (v === q.answer) btn.classList.add('correct');
      else if (selected === v) btn.classList.add('wrong');
    }
    list.appendChild(btn);
  });
  return {
    node: list,
    getValue: () => selected,
    canSubmit: () => selected !== null
  };
}

// --- MULTI CHOICE ---
function bodyMultiChoice(q, answered) {
  let selected = answered ? new Set(answered.given) : new Set();
  const list = el('div', { class: 'options' });
  q.options.forEach((opt, i) => {
    const btn = el('button', {
      class: 'option multi' + (selected.has(i) ? ' selected' : ''),
      disabled: answered ? true : false,
      onclick: () => {
        if (answered) return;
        if (selected.has(i)) selected.delete(i); else selected.add(i);
        list.children[i].classList.toggle('selected');
        document.querySelector('.submit-section')?.classList.add('ready');
      }
    });
    btn.appendChild(el('span', { class: 'marker' }, selected.has(i) ? '✓' : ''));
    btn.appendChild(el('span', {}, opt));
    if (answered) {
      const isCorrect = q.answer.includes(i);
      const wasChosen = answered.given.includes(i);
      if (isCorrect && wasChosen) btn.classList.add('correct');
      else if (!isCorrect && wasChosen) btn.classList.add('wrong');
      else if (isCorrect && !wasChosen) btn.classList.add('missed');
    }
    list.appendChild(btn);
  });
  return {
    node: list,
    getValue: () => [...selected].sort((a, b) => a - b),
    canSubmit: () => selected.size > 0
  };
}

// --- ORDER ---
function bodyOrder(q, answered) {
  // working order: array of original indices
  let order = answered ? answered.given.slice() : shuffle(q.items.map((_, i) => i));
  const wrap = el('div', { class: 'order-list' });

  function redraw() {
    wrap.innerHTML = '';
    order.forEach((origIdx, pos) => {
      const item = el('div', { class: 'order-item' });
      item.appendChild(el('span', { class: 'num' }, String(pos + 1)));
      item.appendChild(el('span', { class: 'text' }, q.items[origIdx]));
      if (!answered) {
        const ctrls = el('div', { class: 'order-controls' });
        const up = el('button', {
          class: 'order-btn',
          disabled: pos === 0,
          onclick: () => {
            if (pos === 0) return;
            [order[pos], order[pos - 1]] = [order[pos - 1], order[pos]];
            redraw();
          }
        }, '↑');
        const down = el('button', {
          class: 'order-btn',
          disabled: pos === order.length - 1,
          onclick: () => {
            if (pos === order.length - 1) return;
            [order[pos], order[pos + 1]] = [order[pos + 1], order[pos]];
            redraw();
          }
        }, '↓');
        ctrls.appendChild(up);
        ctrls.appendChild(down);
        item.appendChild(ctrls);
      }
      if (answered) {
        if (order[pos] === q.answer[pos]) item.classList.add('correct');
        else item.classList.add('wrong');
      }
      wrap.appendChild(item);
    });
  }
  redraw();
  return {
    node: wrap,
    getValue: () => order.slice(),
    canSubmit: () => true
  };
}

// --- MATCH ---
function bodyMatch(q, answered) {
  // answered.given is array same length as left, with index into right
  // user pairs by clicking left then right
  let pairs = answered ? answered.given.slice() : Array(q.left.length).fill(null);
  let activeLeft = null;
  const container = el('div', { class: 'match-container' });
  const leftCol = el('div', { class: 'match-col' });
  const rightCol = el('div', { class: 'match-col' });
  leftCol.appendChild(el('h4', {}, 'Term'));
  rightCol.appendChild(el('h4', {}, 'Description'));

  const leftList = el('div', { class: 'match-list' });
  const rightList = el('div', { class: 'match-list' });

  function pairNumOf(rightIdx) {
    const li = pairs.indexOf(rightIdx);
    return li !== -1 ? (li + 1) : null;
  }

  function redraw() {
    leftList.innerHTML = '';
    rightList.innerHTML = '';
    q.left.forEach((txt, li) => {
      const item = el('div', { class: 'match-item' });
      if (pairs[li] !== null) {
        item.classList.add('matched');
        const n = el('span', { class: 'pair-num' }, String(li + 1));
        item.appendChild(n);
      }
      item.appendChild(document.createTextNode(`${li + 1}. ${txt}`));
      if (activeLeft === li) item.classList.add('selected');
      if (answered) {
        item.classList.add('locked');
        if (pairs[li] === q.answer[li]) item.classList.add('correct');
        else item.classList.add('wrong');
      } else {
        item.addEventListener('click', () => {
          if (pairs[li] !== null) {
            // unpair
            pairs[li] = null;
          }
          activeLeft = activeLeft === li ? null : li;
          redraw();
        });
      }
      leftList.appendChild(item);
    });
    q.right.forEach((txt, ri) => {
      const item = el('div', { class: 'match-item' });
      const pn = pairNumOf(ri);
      if (pn !== null) {
        item.classList.add('matched');
        item.appendChild(el('span', { class: 'pair-num' }, String(pn)));
      }
      item.appendChild(document.createTextNode(txt));
      if (answered) {
        item.classList.add('locked');
        const li = pairs.indexOf(ri);
        if (li !== -1 && q.answer[li] === ri) item.classList.add('correct');
        else if (li !== -1) item.classList.add('wrong');
      } else {
        item.addEventListener('click', () => {
          if (activeLeft === null) return;
          // remove any existing pairing of this right
          const prevLi = pairs.indexOf(ri);
          if (prevLi !== -1) pairs[prevLi] = null;
          pairs[activeLeft] = ri;
          activeLeft = null;
          redraw();
        });
      }
      rightList.appendChild(item);
    });
  }
  redraw();
  leftCol.appendChild(leftList);
  rightCol.appendChild(rightList);
  container.appendChild(leftCol);
  container.appendChild(rightCol);

  return {
    node: container,
    getValue: () => pairs.slice(),
    canSubmit: () => pairs.every(p => p !== null)
  };
}

// --- FILL BLANK ---
function bodyFillBlank(q, answered) {
  const wrap = el('div', {});
  const input = el('input', {
    class: 'fill-blank-input' + (answered ? (answered.isCorrect ? ' correct' : ' wrong') : ''),
    type: 'text',
    placeholder: 'Type your answer here…',
    autocomplete: 'off',
    spellcheck: 'false'
  });
  if (answered) input.value = answered.given;
  if (answered) input.setAttribute('disabled', '');
  wrap.appendChild(input);
  setTimeout(() => { if (!answered) input.focus(); }, 50);
  return {
    node: wrap,
    getValue: () => input.value.trim(),
    canSubmit: () => input.value.trim().length > 0
  };
}

// ===== SUBMIT =====
function submitAnswer(q, getValue, canSubmit, confidence) {
  if (!canSubmit()) return;
  const given = getValue();
  const isCorrect = checkAnswer(q, given);
  state.answers[state.index] = { id: q.id, given, isCorrect, confidence: confidence || null };
  // update history
  if (!state.history.chapters[q.chapter]) state.history.chapters[q.chapter] = { taken: 0, correct: 0 };
  state.history.chapters[q.chapter].taken++;
  state.history.total.taken++;
  if (isCorrect) {
    state.history.chapters[q.chapter].correct++;
    state.history.total.correct++;
    const wi = state.history.wrongIds.indexOf(q.id);
    if (wi !== -1) state.history.wrongIds.splice(wi, 1);
  } else {
    if (!state.history.wrongIds.includes(q.id)) state.history.wrongIds.push(q.id);
  }
  saveHistory();
  if (state.wiseflowMode) {
    // no feedback in WiseFLOW — auto-advance
    state.index++;
    if (state.index >= state.questions.length) finishExam();
    else render();
    return;
  }
  render();
}

// ===== ANKI SPACED REPETITION =====
function rateAndNext(difficulty) {
  if (difficulty !== 'skip') {
    const intervals = { again: 5, good: 10, easy: 15 };
    const interval = intervals[difficulty];
    if (interval) {
      const q = state.questions[state.index];
      const insertAt = Math.min(state.index + 1 + interval, state.questions.length);
      state.questions.splice(insertAt, 0, q);
    }
  }
  state.index++;
  render();
}

function checkAnswer(q, given) {
  switch (q.type) {
    case 'true_false':
      return given === q.answer;
    case 'multi': {
      const a = q.answer.slice().sort((x, y) => x - y);
      const g = given.slice().sort((x, y) => x - y);
      return a.length === g.length && a.every((v, i) => v === g[i]);
    }
    case 'order':
    case 'process':
      return q.answer.every((v, i) => v === given[i]);
    case 'match':
    case 'formula_match':
      return q.answer.every((v, i) => v === given[i]);
    case 'fill_blank': {
      const norm = (s) => s.toLowerCase().trim().replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ');
      const g = norm(given);
      return q.answer.some(a => norm(a) === g);
    }
    default:
      return given === q.answer;
  }
}

// ===== FEEDBACK =====
function renderFeedback(q, ans) {
  const fb = el('div', { class: 'feedback ' + (ans.isCorrect ? 'correct' : 'wrong') });
  if (!ans.isCorrect && ans.confidence === 'certain') {
    fb.appendChild(el('div', { class: 'certain-wrong-alert' }, t('certain_wrong')));
  }
  fb.appendChild(el('div', { class: 'verdict' }, ans.isCorrect ? t('verdict_correct') : t('verdict_wrong')));
  fb.appendChild(el('div', { class: 'explanation', html: q.explanation || '' }));
  if (!ans.isCorrect) {
    fb.appendChild(renderCorrectAnswer(q));
  }
  return fb;
}
function renderCorrectAnswer(q) {
  const wrap = el('div', { class: 'correct-answer' });
  let text = '';
  switch (q.type) {
    case 'true_false':
      text = `Correct answer: ${q.answer ? 'True' : 'False'}`;
      break;
    case 'single':
    case 'formula_match':
    case 'symbol':
    case 'plot':
    case 'figure':
    case 'code':
    case 'select_correct':
    case 'select_wrong':
    case 'scenario': {
      const order = (state.optionOrders || {})[state.index];
      const displayPos = order ? order.indexOf(q.answer) : q.answer;
      text = `Correct answer: ${String.fromCharCode(65 + displayPos)}. ${q.options[q.answer]}`;
      break;
    }
    case 'multi':
      text = 'Correct combination: ' + q.answer.map(i => String.fromCharCode(65 + i)).join(', ');
      break;
    case 'fill_blank':
      text = `Accepted answers: ${q.answer.join(' / ')}`;
      break;
    case 'order':
    case 'process':
      text = 'Correct order: ' + q.answer.map(i => q.items[i]).map((t, i) => `${i + 1}. ${t}`).join(' → ');
      break;
    case 'match':
    case 'formula_match':
      text = 'Correct pairs: ' + q.left.map((l, i) => `[${l} ↔ ${q.right[q.answer[i]]}]`).join(' · ');
      break;
  }
  wrap.appendChild(el('strong', {}, 'Answer key: '));
  wrap.appendChild(document.createTextNode(text.replace(/^Correct answer: |^Correct combination: |^Accepted answers: |^Correct order: |^Correct pairs: /, '')));
  return wrap;
}

// ===== FINISH =====
function finishExam() {
  if (state.timerId) clearInterval(state.timerId);
  state.view = 'result';
  render();
}

function renderResult() {
  // Deduplicate: keep only the LAST attempt per question id
  const seen = new Map();
  state.questions.forEach((q, i) => {
    if (state.answers[i] !== undefined) seen.set(q.id, { q, ans: state.answers[i] });
  });
  const unique = [...seen.values()];
  const total = unique.length;
  const correct = unique.filter(({ ans }) => ans.isCorrect).length;
  const wrong = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const grade = pctToGrade(pct);
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const totalAttempts = state.answers.filter(Boolean).length;

  const wrap = el('div', { class: 'result-screen' });
  if (state.wiseflowMode) {
    wrap.appendChild(el('div', { class: 'wiseflow-badge', style: `color:${pct>=89?'#16a34a':pct>=65?'#d97706':'#dc2626'}` }, grade));
    wrap.appendChild(el('h2', {}, t('wf_result', pct, correct, total)));
    wrap.appendChild(el('div', { class: 'wiseflow-info' }, t('wf_info')));
  } else {
    wrap.appendChild(el('div', { class: 'grade-badge' }, grade));
    wrap.appendChild(el('h2', {}, t('result_pct', pct, correct, total)));
  }
  if (totalAttempts > total) {
    wrap.appendChild(el('p', { style: 'color:var(--ink-3);font-size:13px;margin-top:-8px' }, t('attempts', totalAttempts)));
  }
  const poolName = state.currentPool === CANVAS_QUESTIONS ? t('pool_canvas') : state.currentPool === TOP100_QUESTIONS ? t('pool_top100') : state.currentPool === QUESTIONS ? t('pool_bank') : t('pool_other');
  wrap.appendChild(el('p', { class: 'summary' }, summaryFor(pct, poolName)));

  const detail = el('div', { class: 'score-detail' });
  detail.appendChild(detailItem(correct, t('verdict_correct').replace('✓ ',''), 'green'));
  detail.appendChild(detailItem(wrong, t('verdict_wrong').replace('✗ ',''), 'red'));
  detail.appendChild(detailItem(formatTime(elapsed), state.lang === 'no' ? 'Tid' : 'Time', ''));
  wrap.appendChild(detail);

  const actions = el('div', { class: 'actions', style: 'justify-content: center;' });
  actions.appendChild(el('button', {
    class: 'btn btn-secondary',
    onclick: () => startExam(state.currentPool)
  }, t('try_again')));
  actions.appendChild(el('button', {
    class: 'btn btn-primary',
    onclick: () => goHome()
  }, t('back_overview')));
  actions.appendChild(el('button', {
    class: 'btn btn-ghost',
    onclick: () => exportResults(unique)
  }, t('export_csv')));
  wrap.appendChild(actions);

  // review — unique questions only, wrong ones first
  const review = el('div', { class: 'review-list' });
  review.appendChild(el('h3', {}, t('review_h')));
  const sorted = [...unique].sort((a, b) => a.ans.isCorrect - b.ans.isCorrect);
  const confBadgeMap = { guess: 'conf-badge-guess', unsure: 'conf-badge-unsure', sure: 'conf-badge-sure', certain: 'conf-badge-certain' };
  sorted.forEach(({ q, ans }, i) => {
    const item = el('div', { class: 'review-item ' + (ans.isCorrect ? 'correct' : 'wrong') });
    const txt = q.question.replace(/<[^>]+>/g, '').slice(0, 110);
    const qText = el('div', { class: 'q-text' }, `${i + 1}. ${txt}${q.question.length > 110 ? '…' : ''}`);
    if (ans.confidence) {
      const badges = t('conf_badge');
      qText.appendChild(el('span', { class: 'confidence-badge ' + confBadgeMap[ans.confidence] }, badges[ans.confidence]));
    }
    item.appendChild(qText);
    let statusText = ans.isCorrect ? t('rev_correct') : t('rev_wrong', (q.explanation || '').slice(0, 90) + '…');
    if (!ans.isCorrect && ans.confidence === 'certain') statusText += '  ' + t('rev_certain');
    item.appendChild(el('div', { class: 'q-status' }, statusText));
    review.appendChild(item);
  });
  wrap.appendChild(review);

  return wrap;
}

function detailItem(n, label, cls) {
  const it = el('div', { class: 'item ' + cls });
  it.appendChild(el('span', { class: 'n' }, String(n)));
  it.appendChild(el('span', { class: 'l' }, label));
  return it;
}

function pctToGrade(p) {
  if (p >= 89) return 'A';
  if (p >= 77) return 'B';
  if (p >= 65) return 'C';
  if (p >= 53) return 'D';
  if (p >= 41) return 'E';
  return 'F';
}
function summaryFor(p, chapter) {
  const where = chapter || t('pool_other');
  if (p >= 89) return t('summary_a', where);
  if (p >= 77) return t('summary_b', where);
  if (p >= 65) return t('summary_c', where);
  if (p >= 41) return t('summary_d', where);
  return t('summary_f', where);
}

function renderFormulaSheet() {
  const sheet = el('div', {});
  function section(title, blocks) {
    const sec = el('div', { class: 'fs-section' });
    sec.appendChild(el('h3', { class: 'fs-heading' }, title));
    blocks.forEach(b => sec.appendChild(b));
    return sec;
  }
  function block(formulaText, symbols) {
    const div = el('div', { class: 'fs-block' });
    div.appendChild(el('div', { class: 'fs-formula' }, formulaText));
    if (symbols && symbols.length) {
      const ul = el('ul', { class: 'fs-symbols' });
      symbols.forEach(s => ul.appendChild(el('li', {}, s)));
      div.appendChild(ul);
    }
    return div;
  }
  sheet.appendChild(section('1. Support Vector Machine (SVM)', [
    block('Margin = 2 / ‖w‖', ['w: weight vector defining the decision boundary hyperplane', '‖w‖: Euclidean norm of the weight vector', 'Maximizing margin ⟺ minimizing ‖w‖']),
    block('Decision boundary: wᵀx + b = 0', ['wᵀx: dot product of weights and input features', 'b: bias (intercept) term', 'Points with wᵀx + b > 0 are class +1, < 0 are class −1']),
    block('Soft-margin objective: min ½‖w‖² + C·Σξᵢ', ['C: regularization — large C = narrow margin, few training errors; small C = wide margin, more tolerant', 'ξᵢ: slack variable — how far sample i violates the margin'])
  ]));
  sheet.appendChild(section('2. Linear & Logistic Regression', [
    block('OLS Normal Equation: w = (XᵀX)⁻¹Xᵀy', ['X: design matrix (n_samples × n_features)', 'y: target vector', 'w: optimal weights minimizing squared residuals', '(XᵀX)⁻¹: inverse of the Gram matrix']),
    block('Sigmoid: σ(z) = 1 / (1 + e⁻ᶻ)', ['z: linear combination wᵀx + b', 'σ(z): squashes any real number into (0,1) — interpreted as probability']),
    block('Log-odds (Logit): log(p / (1 − p)) = wᵀx + b', ['p: predicted probability of the positive class', 'Logit is the inverse of the sigmoid function']),
    block('Cross-Entropy Cost: J(w) = −(1/n)·Σ[yᵢ·log(ŷᵢ) + (1−yᵢ)·log(1−ŷᵢ)]', ['n: number of training samples', 'yᵢ: true label (0 or 1)', 'ŷᵢ: predicted probability σ(wᵀxᵢ + b)', 'Penalizes confident wrong predictions more heavily'])
  ]));
  sheet.appendChild(section('3. Adaline / Perceptron', [
    block('Net input: z = wᵀx = w₀ + w₁x₁ + … + wₘxₘ', ['w₀: bias unit (x₀ = 1)', 'wⱼ: weight for feature j', 'xⱼ: value of feature j']),
    block('Adaline weight update (Delta Rule): wⱼ := wⱼ + η·Σ(yᵢ − ŷᵢ)·xᵢⱼ', ['η: learning rate', 'yᵢ: true continuous target', 'ŷᵢ: predicted output (linear activation)', 'Adaline uses continuous output; Perceptron uses class labels']),
    block('Perceptron update: wⱼ := wⱼ + η·(yᵢ − ŷᵢ)·xᵢⱼ', ['Update only fires when ŷᵢ ≠ yᵢ', 'Convergence guaranteed only for linearly separable data'])
  ]));
  sheet.appendChild(section('4. Gradient Descent', [
    block('Weight update: w := w − η·∇J(w)', ['η: learning rate — controls step size', '∇J(w): gradient of cost function (vector of partial derivatives)', 'Moves weights in direction of steepest descent']),
    block('Partial derivative (MSE): ∂J/∂wⱼ = −(2/n)·Σ(yᵢ − ŷᵢ)·xᵢⱼ', ['n: number of samples (n=1 for SGD, batch size for mini-batch)', 'yᵢ − ŷᵢ: residual error for sample i'])
  ]));
  sheet.appendChild(section('5. Principal Component Analysis (PCA)', [
    block('Covariance matrix: Σ = (1/(n−1))·XᵀX  (mean-centered X)', ['Σ: d×d symmetric matrix capturing feature co-variation', 'X must be mean-centered before computing Σ']),
    block('Eigendecomposition: Σ·v = λ·v', ['v: eigenvector — direction of a principal component', 'λ: eigenvalue — variance explained along that eigenvector', 'Sort eigenvectors by descending λ to rank components']),
    block('Explained variance ratio: EVRₖ = λₖ / Σᵢλᵢ', ['λₖ: eigenvalue of the k-th principal component', 'Σᵢλᵢ: sum of all eigenvalues (total variance)'])
  ]));
  sheet.appendChild(section('6. Linear Discriminant Analysis (LDA)', [
    block('Between-class scatter: S_B = Σᵢ nᵢ·(μᵢ − μ)(μᵢ − μ)ᵀ', ['nᵢ: number of samples in class i', 'μᵢ: mean vector of class i', 'μ: overall mean vector', 'S_B measures how far class means are from the global mean']),
    block('Within-class scatter: S_W = Σᵢ Σₓ∈Cᵢ (x − μᵢ)(x − μᵢ)ᵀ', ['Cᵢ: samples in class i', 'S_W measures spread of samples around their class mean']),
    block('LDA objective: maximize J(w) = wᵀS_B w / wᵀS_W w', ['Solved via generalized eigenvalue problem: S_B·v = λ·S_W·v', 'Choose eigenvectors with largest eigenvalues as discriminants'])
  ]));
  sheet.appendChild(section('7. Regularization', [
    block('L1 (Lasso): J_reg(w) = J(w) + λ·Σⱼ|wⱼ|', ['λ: regularization strength', '|wⱼ|: absolute value of weight j', 'L1 promotes sparsity — drives irrelevant weights to exactly zero', 'Use for feature selection']),
    block('L2 (Ridge): J_reg(w) = J(w) + λ·Σⱼwⱼ²', ['wⱼ²: squared weight — penalizes large weights', 'L2 shrinks all weights toward zero but rarely reaches exactly zero', 'Good when features are correlated (multicollinearity)'])
  ]));
  sheet.appendChild(section('8. Decision Trees', [
    block('Gini Impurity: Gini(t) = 1 − Σₖ p(k|t)²', ['t: current tree node', 'p(k|t): proportion of class k at node t', 'Gini = 0: pure node; Gini = 0.5: maximally mixed (binary)']),
    block('Entropy: H(t) = −Σₖ p(k|t)·log₂ p(k|t)', ['H = 0: pure node; H = 1: maximally uncertain (binary)']),
    block('Information Gain: IG = H(parent) − Σⱼ (nⱼ/n)·H(childⱼ)', ['H(parent): entropy before split', 'nⱼ: samples in child j', 'Choose the split that maximizes IG'])
  ]));
  sheet.appendChild(section('9. Ensemble — AdaBoost', [
    block('Weighted error: εⱼ = Σᵢ wᵢ·𝟙[ŷᵢ ≠ yᵢ] / Σᵢ wᵢ', ['εⱼ: weighted misclassification rate of weak learner j', 'wᵢ: sample weight at round j', '𝟙[·]: indicator function (1 if misclassified, 0 otherwise)']),
    block('Classifier weight: αⱼ = ½·ln((1 − εⱼ) / εⱼ)', ['αⱼ > 0 when εⱼ < 0.5 (better than random)', 'Larger αⱼ for more accurate classifiers']),
    block('Sample weight update: wᵢ := wᵢ · exp(−αⱼ · yᵢ · ŷᵢ)  then normalize', ['Misclassified samples get higher weight', 'Correctly classified samples get lower weight'])
  ]));
  sheet.appendChild(section('10. Gradient Boosting', [
    block('Additive model: Fₘ(x) = Fₘ₋₁(x) + η·hₘ(x)', ['Fₘ(x): ensemble prediction at round m', 'η: learning rate — shrinks each tree\'s contribution', 'hₘ(x): weak learner fitted at round m']),
    block('Pseudo-residuals: rᵢₘ = yᵢ − Fₘ₋₁(xᵢ)', ['Each new tree hₘ is trained to predict these residuals', 'Equivalent to gradient of MSE loss w.r.t. current predictions'])
  ]));
  sheet.appendChild(section('11. K-Means Clustering', [
    block('Objective (Inertia): J = Σₖ Σₓ∈Cₖ ‖x − μₖ‖²', ['K: number of clusters', 'Cₖ: samples assigned to cluster k', 'μₖ: centroid (mean) of cluster k', '‖x − μₖ‖²: squared Euclidean distance to centroid', 'Algorithm: assign to nearest centroid → recompute centroids → repeat'])
  ]));
  sheet.appendChild(section('12. Evaluation Metrics', [
    block('TP: true positive  |  TN: true negative  |  FP: false positive  |  FN: false negative', ['FP: predicted positive, actually negative (Type I error)', 'FN: predicted negative, actually positive (Type II error)']),
    block('Accuracy = (TP + TN) / (TP + TN + FP + FN)', ['Misleading when classes are imbalanced']),
    block('Precision = TP / (TP + FP)', ['High precision → few false alarms']),
    block('Recall (Sensitivity) = TP / (TP + FN)', ['High recall → few missed positives']),
    block('F1 Score = 2 · (Precision · Recall) / (Precision + Recall)', ['Harmonic mean of Precision and Recall', 'Useful when classes are imbalanced'])
  ]));
  sheet.appendChild(section('13. RBF Kernel', [
    block('κ(x, z) = exp(−γ · ‖x − z‖²)', ['γ (gamma): controls width of the Gaussian', 'Large γ: narrow kernel, complex boundary, risk of overfitting', 'Small γ: wide kernel, smoother boundary, risk of underfitting', 'κ = 1 when x = z; approaches 0 as distance grows'])
  ]));
  sheet.appendChild(section('14. Bias-Variance Trade-off', [
    block('Expected MSE = Bias²(ŷ) + Variance(ŷ) + σ²', ['Bias²: error from wrong assumptions (underfitting)', 'Variance: sensitivity to training data fluctuations (overfitting)', 'σ²: irreducible noise — cannot be eliminated', 'Simple models: high bias, low variance', 'Complex models: low bias, high variance'])
  ]));
  sheet.appendChild(section('15. Linear Regression — Goodness of Fit', [
    block('OLS: w = (XᵀX)⁻¹·Xᵀy', ['Requires XᵀX to be invertible (no perfectly correlated features)']),
    block('R² = 1 − SS_res / SS_tot', ['SS_res = Σ(yᵢ − ŷᵢ)²: sum of squared residuals', 'SS_tot = Σ(yᵢ − ȳ)²: total variance', 'R² = 1: perfect fit; R² = 0: no better than predicting the mean']),
    block('RANSAC (Random Sample Consensus)', ['Purpose: fit a robust model by iteratively ignoring outliers', 'Randomly samples a subset → fits model → counts inliers → keeps best model'])
  ]));
  return sheet;
}

    })
    .filter(Boolean)
    .sort((a, b) => a.pct - b.pct);

  // add any unknown chapters not in the list above
  chapKeys.forEach(key => {
    if (!chapterDefs.find(c => c.key === key)) {
      const d = chaps[key];
      if (d && d.taken > 0) {
        const pct = Math.round((d.correct / d.taken) * 100);
        rows.push({ label: key, pct, correct: d.correct, taken: d.taken });
      }
    }
  });

  const section = el('div', { style: 'display:flex;flex-direction:column;gap:12px;' });
  rows.forEach(({ label, pct, correct, taken }) => {
    const color = pct >= 80 ? '#16a34a' : pct >= 60 ? '#d97706' : '#dc2626';
    const row = el('div', { style: 'background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;' });
    const top = el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;' });
    top.appendChild(el('span', { style: 'font-size:13px;font-weight:600;' }, label));
    top.appendChild(el('span', { style: `font-size:13px;font-weight:700;color:${color};` }, `${pct}%  (${correct}/${taken})`));
    row.appendChild(top);
    const track = el('div', { class: 'prog-track' });
    track.appendChild(el('div', { class: 'prog-fill', style: `width:${pct}%;background:${color};` }));
    row.appendChild(track);
    section.appendChild(row);
  });
  wrap.appendChild(section);
  return wrap;
}

// ===== EXPORT RESULTS =====
function exportResults(unique) {
  const header = ['#','ID','Question','Your Answer','Correct Answer','Result','Confidence','Chapter'];
  const rows = unique.map(({ q, ans }, i) => {
    const yourAnswer = Array.isArray(ans.selected) ? ans.selected.join(' | ') : (ans.selected || ans.input || '');
    const correctAnswer = Array.isArray(q.answer) ? q.answer.join(' | ') : (q.answer || '');
    const escape = s => '"' + String(s).replace(/"/g, '""') + '"';
    return [
      i + 1, q.id,
      escape(q.question.replace(/<[^>]+>/g, '').replace(/\n/g, ' ')),
      escape(yourAnswer),
      escape(correctAnswer),
      ans.isCorrect ? 'Correct' : 'Wrong',
      ans.confidence || '',
      escape(q.chapter || '')
    ].join(',');
  });
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dat200-results-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if (state.view !== 'exam') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const answered = state.answers[state.index] !== undefined;
  const num = parseInt(e.key);
  if (!answered) {
    if (num >= 1 && num <= 4) {
      const opts = document.querySelectorAll('.options .option:not([disabled])');
      if (opts[num - 1]) { opts[num - 1].click(); e.preventDefault(); }
    }
    if (e.key === 'Enter') {
      if (state._currentAnswerUi && state._currentAnswerUi.canSubmit()) {
        submitAnswer(state._currentQ, state._currentAnswerUi.getValue, state._currentAnswerUi.canSubmit, null);
        e.preventDefault();
      }
    }
  } else if (!state.wiseflowMode) {
    const ratingKeys = ['skip', 'again', 'good', 'easy'];
    if (num >= 1 && num <= 4) { rateAndNext(ratingKeys[num - 1]); e.preventDefault(); }
  }
  if (e.key === 'ArrowLeft' && state.index > 0) {
    state.index--; render(); e.preventDefault();
  }
});

// ===== BOOT =====
render();
</script>
